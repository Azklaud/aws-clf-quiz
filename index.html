<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CH1AY AWS ｜ CLF-C02 練習系統</title>
  <meta name="description" content="AWS CLF-C02 線上刷題系統，支援中英文切換與複選題練習">
  <meta property="og:title" content="AWS Quiz App｜CLF-C02 練習系統">
  <meta property="og:description" content="線上 AWS 刷題系統｜中英文切換｜模擬測驗">
  <meta property="og:type" content="website">
  <style>
    :root{
      --bg:#f7f1ff;
      --bg-2:#f2e8ff;
      --card:rgba(255,255,255,.86);
      --card-strong:#ffffff;
      --line:#e5d8fb;
      --line-2:#d8c2fb;
      --text:#473662;
      --muted:#7f6c9f;
      --primary:#c8a3ff;
      --primary-2:#b985ff;
      --deep:#6b44b5;
      --deep-2:#553296;
      --deep-3:#442475;
      --good:#8f73da;
      --good-bg:#f0e9ff;
      --wrong:#d377a2;
      --wrong-bg:#ffeaf4;
      --shadow:0 14px 35px rgba(107,68,181,.14);
      --radius:24px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 8% 12%, rgba(200,163,255,.28) 0 90px, transparent 91px),
        radial-gradient(circle at 92% 18%, rgba(107,68,181,.12) 0 85px, transparent 86px),
        radial-gradient(circle at 84% 80%, rgba(185,133,255,.18) 0 110px, transparent 111px),
        radial-gradient(circle at 10% 84%, rgba(107,68,181,.1) 0 65px, transparent 66px),
        linear-gradient(180deg, #fbf8ff 0%, #f4edff 100%);
      background-attachment: fixed;
    }

    .wrap{
      width:min(1320px, calc(100vw - 28px));
      margin:18px auto 28px;
      display:grid;
      grid-template-columns: 320px 1fr;
      gap:18px;
      align-items:start;
    }

    .card{
      background:var(--card);
      backdrop-filter: blur(14px);
      border:1px solid rgba(255,255,255,.8);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    .sidebar{
      padding:18px;
      position:sticky;
      top:16px;
    }

    .main{
      padding:18px;
    }

    h1{
      margin:0;
      font-size:1.55rem;
      color:var(--deep);
      letter-spacing:.02em;
    }

    .subtitle{
      margin-top:8px;
      color:var(--muted);
      line-height:1.6;
      font-size:.95rem;
    }

    .toolbar{
      display:grid;
      gap:12px;
      margin-top:16px;
    }

    label{
      display:block;
      font-size:.9rem;
      color:var(--muted);
      margin-bottom:6px;
      font-weight:600;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .row > *{ flex:1; }

    input,select,button{
      width:100%;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.92);
      color:var(--text);
      padding:11px 14px;
      font-size:.95rem;
      outline:none;
      transition:.15s ease;
    }

    input:focus,select:focus{
      border-color:var(--primary-2);
      box-shadow:0 0 0 4px rgba(185,133,255,.14);
    }

    button{
      cursor:pointer;
      background:linear-gradient(180deg, var(--primary) 0%, var(--primary-2) 100%);
      color:white;
      font-weight:800;
      border-color:transparent;
      box-shadow:0 9px 20px rgba(107,68,181,.18);
    }

    button:hover{ transform:translateY(-1px); filter:brightness(1.02); }
    button:active{ transform:translateY(0); }

    button.secondary{
      background:#f2e9ff;
      color:var(--deep);
      border:1px solid #decafc;
      box-shadow:none;
    }

    button.good{
      background:linear-gradient(180deg, #8f73da 0%, #7455c8 100%);
    }

    button.warn{
      background:linear-gradient(180deg, #7d58d4 0%, #633db9 100%);
    }

    .pill-row{
      display:grid;
      gap:10px;
      margin-top:16px;
    }

    .pill{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:12px 14px;
      border-radius:18px;
      background:rgba(255,255,255,.78);
      border:1px solid var(--line);
      font-size:.92rem;
      color:var(--muted);
    }

    .pill b{ color:var(--deep); font-size:1rem; }

    .section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:18px;
      margin-bottom:10px;
    }

    .section-title strong{
      color:var(--deep);
      font-size:1rem;
    }

    .status-list{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      max-height:340px;
      overflow:auto;
      padding-right:4px;
    }

    .status-list::-webkit-scrollbar{ width:8px; }
    .status-list::-webkit-scrollbar-thumb{ background:#ccb1ff; border-radius:999px; }

    .status-btn{
      width:100%;
      padding:11px 0;
      border-radius:16px;
      border:1px solid #dfcdfb;
      background:linear-gradient(180deg, #d6b7ff 0%, #c18fff 100%);
      color:white;
      font-size:.9rem;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 6px 14px rgba(107,68,181,.1);
    }

    .status-btn.current{
      background:linear-gradient(180deg, var(--deep) 0%, var(--deep-2) 100%);
      outline:2px solid rgba(107,68,181,.16);
      outline-offset:2px;
    }

    .status-btn.done{
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.34), 0 6px 14px rgba(107,68,181,.1);
      filter: grayscale(0.4);
      opacity: 0.85;
    }

    .status-btn.flagged::after{
      content:"★";
      position:absolute;
      top:4px;
      right:8px;
      font-size:.75rem;
      opacity:.95;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .topbar .pill{
      width:auto;
      min-width:140px;
      justify-content:center;
      background:rgba(255,255,255,.66);
    }

    .question-box{
      padding:22px;
      border-radius:24px;
      background:rgba(255,255,255,.68);
      border:1px solid var(--line);
      box-shadow:0 8px 22px rgba(107,68,181,.08);
    }

    .q-id{
      color:var(--deep);
      font-weight:900;
      letter-spacing:.06em;
      margin-bottom:14px;
      font-size:.95rem;
    }

    .q-zh{
      font-size:1.28rem;
      line-height:1.75;
      font-weight:700;
      color:var(--text);
    }

    .en-wrap{
      margin-top:14px;
      display:block;
      padding:14px 16px;
      border-radius:18px;
      background:#faf7ff;
      border:1px dashed #dcc7ff;
    }

    .q-en{
      font-size:.98rem;
      line-height:1.7;
      color:var(--muted);
    }

    .options{
      display:grid;
      gap:12px;
      margin-top:16px;
    }

    .option{
      border:1.5px solid #e7dbfb;
      border-radius:22px;
      padding:16px;
      background:rgba(255,255,255,.9);
      cursor:pointer;
      transition:.15s ease;
    }

    .option:hover{
      border-color:#caa7ff;
      background:#fcfaff;
      transform:translateY(-1px);
    }

    .option.selected{
      border-color:var(--deep);
      box-shadow:0 0 0 4px rgba(107,68,181,.09);
    }

    .option.correct{
      background:var(--good-bg);
      border-color:var(--good);
    }

    .option.wrong{
      background:var(--wrong-bg);
      border-color:var(--wrong);
    }

    .option-head{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .badge{
      min-width:38px;
      height:38px;
      border-radius:50%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:#efe6ff;
      color:var(--deep);
      font-weight:900;
      border:1px solid #ddc7ff;
      flex-shrink:0;
      margin-right: 12px;
    }

    .opt-zh{
      line-height:1.75;
      font-weight:700;
      color:var(--text);
    }

    .opt-en{
      margin-top:4px;
      color:var(--muted);
      line-height:1.65;
      font-size:.93rem;
    }

    .action-row{
      display:flex;
      gap:10px;
      margin-top:18px;
      flex-wrap:wrap;
    }

    .action-row button{
      width:auto;
      min-width:120px;
    }

    .feedback{
      margin-top:16px;
      padding:14px 16px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.84);
      line-height:1.75;
      display:none;
    }

    .feedback.show{ display:block; }
    .feedback.ok{ border-color:var(--good); background:var(--good-bg); }
    .feedback.no{ border-color:var(--wrong); background:var(--wrong-bg); }

    .helper{
      color:var(--muted);
      font-size:.9rem;
      line-height:1.65;
    }

    @media (max-width: 980px){
      .wrap{ grid-template-columns:1fr; }
      .sidebar{ position:static; }
      .status-list{ grid-template-columns:repeat(5,1fr); max-height:260px; }
    }

    @media (max-width: 680px){
      .wrap{ width:min(100vw - 18px, 100%); margin:10px auto 18px; }
      .main,.sidebar,.question-box{ padding:16px; }
      .status-list{ grid-template-columns:repeat(4,1fr); }
      .q-zh{ font-size:1.08rem; }
      .action-row button{ flex:1 1 calc(50% - 10px); min-width:auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="card sidebar">
      <h1>CH1AY AWS</h1>
      <div class="subtitle"><b>交大波迪猴子製作</b></div>

      <div class="toolbar">
        <div>
          <label for="jsonPath">JSON 檔名 / 路徑</label>
          <input id="jsonPath" value="aws_clf_c02_full.json" />
        </div>

        <div class="row">
          <button id="loadBtn">載入資料</button>
          <button id="reloadBtn" class="secondary">重新載入</button>
        </div>

        <div>
          <label for="searchInput">搜尋題號 / 關鍵字</label>
          <input id="searchInput" placeholder="例如 0035 / Inspector / 安全" />
        </div>

        <div>
          <label for="modeSelect">模式</label>
          <select id="modeSelect">
            <option value="practice">練習模式（可看答案）</option>
            <option value="exam">測驗模式（答完才顯示）</option>
          </select>
        </div>

        <div class="row">
          <button id="randomBtn" class="warn">隨機一題</button>
          <button id="flagBtn" class="secondary">標記此題</button>
        </div>

        <div class="row">
          <button id="onlyWrongBtn" class="secondary">只看答錯</button>
          <button id="togglePanelBtn" class="secondary">隱藏題號</button>
        </div>

        <div class="row">
          <button id="resetProgressBtn" class="secondary">清除紀錄</button>
        </div>
      </div>

      <div class="pill-row">
        <div class="pill"><span>總題數</span><b id="totalCount">0</b></div>
        <div class="pill"><span>目前索引</span><b id="currentIndex">0</b></div>
        <div class="pill"><span>已答 / 答對</span><b id="scoreInfo">0 / 0</b></div>
      </div>

      <div class="section-title">
        <strong>題號列表</strong>
      </div>
      <div class="status-list" id="statusList"></div>

      <div class="helper" style="margin-top:14px;">
        作答、標記與模式會自動存在瀏覽器 localStorage。<br>
        鍵盤也能操作：A/B/C/D/E 選答案、Enter 送出、←/→ 換題、R 隨機。
      </div>
    </aside>

    <main class="card main" id="mainRoot">
      <div class="topbar">
        <div class="pill">題號：<b id="qidText">-</b></div>
        <div class="pill">模式：<b id="modeText">練習模式</b></div>
      </div>

      <div class="question-box" id="questionWrap">
        <div class="q-id" id="qId">QUESTION ----</div>
        <div class="q-zh" id="qZh">請先載入 JSON 檔。</div>
        <div class="en-wrap" id="enWrap">
          <div class="q-en" id="qEn">請點擊左側「載入資料」按鈕。</div>
        </div>
      </div>

      <div class="options" id="options"></div>

      <div class="action-row">
        <button id="prevBtn" class="secondary">上一題</button>
        <button id="submitBtn" class="good">確認送出</button>
        <button id="nextBtn">下一題</button>
      </div>

      <div class="feedback" id="feedback"></div>
    </main>
  </div>

  <script>
    let allQuestions = [];
    let filteredIndexes = [];
    let currentFilteredPos = 0;
    let currentSelectedChoices = []; // 支援複選的核心陣列

    const STORAGE_KEY = 'aws-clf-c02-live-state-purple-v1';
    let progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { answers: {}, flagged: {} };

    // 初始化自動加載資料
    async function loadQuestions() {
      const path = els.jsonPath.value.trim();
      try {
        const res = await fetch(path);
        allQuestions = await res.json();
        els.totalCount.textContent = allQuestions.length;
        applyFilter();
        showQuestion();
      } catch (err) {
        els.qZh.textContent = '載入失敗';
        els.qEn.textContent = '請點擊左側【載入資料】按鈕手動輸入正確的檔案名稱。';
      }
    }

    function applyFilter() {
      const keyword = els.searchInput.value.trim().toLowerCase();
      filteredIndexes = [];
      
      allQuestions.forEach((q, idx) => {
        const status = progress.answers[q.id];
        if (state.onlyWrong && status !== 'wrong') return;
        
        if (keyword) {
          const contentStr = (q.id + " " + q.question + " " + q.options.join(" ")).toLowerCase();
          if (!contentStr.includes(keyword)) return;
        }
        filteredIndexes.push(idx);
      });

      if (currentFilteredPos >= filteredIndexes.length) {
        currentFilteredPos = Math.max(0, filteredIndexes.length - 1);
      }
      updateSidebarStats();
    }

    function showQuestion() {
      if (filteredIndexes.length === 0) {
        els.qidText.textContent = '-';
        els.qId.textContent = '沒有符合的題目';
        els.qZh.textContent = '請更換關鍵字或關閉只看答錯。';
        els.qEn.textContent = '';
        els.options.innerHTML = '';
        els.feedback.style.display = 'none';
        return;
      }

      const originalIdx = filteredIndexes[currentFilteredPos];
      const q = allQuestions[originalIdx];
      
      els.qidText.textContent = q.id;
      els.qId.textContent = `QUESTION ${q.id}`;
      currentSelectedChoices = [];

      // 自動解析清洗中英雙語題目
      const qParts = q.question.replace(/英文:|中文:/g, '|||').split('|||').filter(t => t.trim() !== '');
      els.qZh.textContent = qParts[1] || qParts[0];
      els.qEn.textContent = qParts[1] ? qParts[0] : 'AWS Certified Cloud Practitioner';

      els.options.innerHTML = '';
      els.feedback.style.display = 'none';
      document.getElementById('submitBtn').disabled = false;

      // 解析題目正確答案數量 (單選1個，複選多個如 A,D)
      const correctAnswers = q.answer.split(',').map(a => a.trim());

      q.options.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'option';
        
        let cleanOpt = opt.replace(/英文:|中文:|\|/g, '|||');
        let parts = cleanOpt.split('|||').filter(t => t.trim() !== '');
        let prefix = parts[0] ? parts[0].substring(0,2) : '';
        let enPart = parts[0] ? parts[0].substring(2).trim() : '';
        let zhPart = parts[1] ? parts[1].trim() : '';
        
        const myLetter = prefix.substring(0,1);
        div.dataset.choice = myLetter;

        div.innerHTML = `
          <div class="option-head">
            <div class="badge">${myLetter}</div>
            <div class="option-content">
              <div class="opt-zh">${zhPart || enPart}</div>
              <div class="opt-en">${zhPart ? enPart : ''}</div>
            </div>
          </div>
        `;

        // 核心：支援單選/複選混合的點擊事件
        div.onclick = () => {
          if (document.getElementById('submitBtn').disabled) return;

          if (correctAnswers.length === 1) {
            // 單選模式
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            div.classList.add('selected');
            currentSelectedChoices = [myLetter];
            checkAnswer(); // 單選直接對答案
          } else {
            // 複選模式
            if (div.classList.contains('selected')) {
              div.classList.remove('selected');
              currentSelectedChoices = currentSelectedChoices.filter(c => c !== myLetter);
            } else {
              if (currentSelectedChoices.length < correctAnswers.length) {
                div.classList.add('selected');
                currentSelectedChoices.push(myLetter);
              } else {
                alert(`本題為複選題，只能選擇 ${correctAnswers.length} 個選項喔！`);
              }
            }
          }
        };
        els.options.appendChild(div);
      });

      // 如果是先前做過的題目，重新渲染它的作答狀態
      const historyStatus = progress.answers[q.id];
      if (historyStatus) {
        // 為了不影響刷題體驗，做過的題目可以自由查看
      }

      updateSidebarStats();
      renderStatusGrid();
    }

    function checkAnswer() {
      if (filteredIndexes.length === 0) return;
      const originalIdx = filteredIndexes[currentFilteredPos];
      const q = allQuestions[originalIdx];
      const correctAnswers = q.answer.split(',').map(a => a.trim());

      if (currentSelectedChoices.length === 0) return alert("請先選取答案！");
      if (correctAnswers.length > 1 && currentSelectedChoices.length < correctAnswers.length) {
        return alert(`這是複選題，您需要選滿 ${correctAnswers.length} 個答案。`);
      }

      document.getElementById('submitBtn').disabled = true;

      // 檢查是否全對
      const wrongChoices = currentSelectedChoices.filter(c => !correctAnswers.includes(c));
      const isCorrect = wrongChoices.length === 0 && currentSelectedChoices.length === correctAnswers.length;

      els.feedback.style.display = 'block';
      els.feedback.className = `feedback show ${isCorrect ? 'ok' : 'no'}`;
      els.feedback.innerHTML = isCorrect 
        ? `✨ <b>答對了！</b> 正確答案是：<b class="text-xl">${q.answer}</b>` 
        : `❌ <b>答錯了！</b> 您的選擇：${currentSelectedChoices.join(',')}，正確答案是：<b class="text-xl">${q.answer}</b>`;

      // 記錄作答狀態到 LocalStorage
      if (!progress.answers[q.id]) {
        progress.answers[q.id] = isCorrect ? 'correct' : 'wrong';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      }

      // 將選項著色 (正確變綠，選錯變紅)
      document.querySelectorAll('.option').forEach(opt => {
        const letter = opt.dataset.choice;
        if (correctAnswers.includes(letter)) {
          opt.classList.remove('selected');
          opt.classList.add('correct');
        } else if (currentSelectedChoices.includes(letter)) {
          opt.classList.remove('selected');
          opt.classList.add('wrong');
        }
      });

      updateSidebarStats();
      renderStatusGrid();
    }

    function move(step) {
      if (filteredIndexes.length === 0) return;
      currentFilteredPos += step;
      if (currentFilteredPos < 0) currentFilteredPos = 0;
      if (currentFilteredPos >= filteredIndexes.length) currentFilteredPos = filteredIndexes.length - 1;
      showQuestion();
    }

    function renderStatusGrid() {
      els.statusList.innerHTML = '';
      filteredIndexes.forEach((originalIdx, pos) => {
        const q = allQuestions[originalIdx];
        const btn = document.createElement('button');
        btn.className = 'status-btn';
        btn.textContent = q.id.replace(/^0+/, ''); // 縮短題號顯示

        if (pos === currentFilteredPos) btn.classList.add('current');
        if (progress.answers[q.id]) btn.classList.add('done');
        if (progress.flagged[q.id]) btn.classList.add('flagged');

        btn.onclick = () => {
          currentFilteredPos = pos;
          showQuestion();
        };
        els.statusList.appendChild(btn);
      });
      els.statusList.style.display = state.panelOpen ? 'grid' : 'none';
    }

    function updateSidebarStats() {
      els.currentIndex.textContent = filteredIndexes.length ? `${currentFilteredPos + 1} / ${filteredIndexes.length}` : '0';
      const answersArr = Object.values(progress.answers);
      const totalAns = answersArr.length;
      const totalCorrect = answersArr.filter(v => v === 'correct').length;
      els.scoreInfo.textContent = `${totalCorrect} / ${totalAns}`;
    }

    // 狀態管理變數
    const state = { onlyWrong: false, panelOpen: true };

    // 綁定所有按鈕事件
    els.loadBtn.onclick = loadQuestions;
    els.reloadBtn.onclick = loadQuestions;
    document.getElementById('nextBtn').onclick = () => move(1);
    document.getElementById('prevBtn').onclick = () => move(-1);
    document.getElementById('submitBtn').onclick = checkAnswer;
    
    document.getElementById('randomBtn').onclick = () => {
      if (filteredIndexes.length === 0) return;
      currentFilteredPos = Math.floor(Math.random() * filteredIndexes.length);
      showQuestion();
    };

    document.getElementById('flagBtn').onclick = () => {
      if (filteredIndexes.length === 0) return;
      const q = allQuestions[filteredIndexes[currentFilteredPos]];
      progress.flagged[q.id] = !progress.flagged[q.id];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      renderStatusGrid();
    };

    document.getElementById('onlyWrongBtn').onclick = () => {
      state.onlyWrong = !state.onlyWrong;
      document.getElementById('onlyWrongBtn').textContent = state.onlyWrong ? '顯示全部' : '只看答錯';
      applyFilter();
      currentFilteredPos = 0;
      showQuestion();
    };

    document.getElementById('togglePanelBtn').onclick = () => {
      state.panelOpen = !state.panelOpen;
      document.getElementById('togglePanelBtn').textContent = state.panelOpen ? '隱藏題號' : '顯示題號';
      renderStatusGrid();
    };

    document.getElementById('resetProgressBtn').onclick = () => {
      if (confirm('確定要清除所有做題紀錄與標記嗎？')) {
        localStorage.removeItem(STORAGE_KEY);
        progress = { answers: {}, flagged: {} };
        applyFilter();
        currentFilteredPos = 0;
        showQuestion();
      }
    };

    els.searchInput.oninput = () => {
      applyFilter();
      currentFilteredPos = 0;
      showQuestion();
    };

    // 鍵盤快捷鍵支援
    window.onkeydown = (e) => {
      if (['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
      if (e.key === 'ArrowLeft') move(-1);
      if (e.key === 'ArrowRight') move(1);
      if (e.key.toLowerCase() === 'r') document.getElementById('randomBtn').click();
      if (e.key === 'Enter') checkAnswer();
    };

    // 網頁開啟時自動載入
    window.onload = loadQuestions;
  </script>
</body>
</html>
